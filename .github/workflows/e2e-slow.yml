# Campaigns that are followed to the end but take longer than the regular suite
# can hold: a microcircuit simulation, an e-model optimisation. They are tagged
# `@slow`, and only `--project=slow` defines the project that runs them, so they
# run here on their own with hours rather than minutes on the clock.
#
# Each test's own budget comes from its seed — `expect.completed.within` where
# the case names one, four hours where it does not — and this job only has to
# outlast the slowest of them.
#
# It has no trigger of its own. `e2e.yml` starts it for every run that includes
# the slow suite — the 06:00 Zurich schedule, a merge to this repository's main,
# a web-app release, a manual run with `slow` ticked — and hands it that run's
# key, so both suites post into one Teams thread and publish into one report
# folder. Started here by hand, with no key, it is a run of its own.
name: E2E (slow)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [preview, staging, production]
        default: staging
      thread_key:
        description: Set by e2e.yml. Leave empty for a run of its own.
        type: string
        default: ''
      started:
        description: Set by e2e.yml, with the key.
        type: string
        default: ''
      event:
        description: Set by e2e.yml — what started the run.
        type: string
        default: ''
      release:
        description: Set by e2e.yml for a web-app release.
        type: string
        default: ''
      release_url:
        description: Set by e2e.yml for a web-app release.
        type: string
        default: ''
      release_commit:
        description: Set by e2e.yml for a web-app merge.
        type: string
        default: ''

concurrency:
  # One group per run, so a slow run never waits on or cancels another. The same
  # key twice is the same run started again, and that queues behind the first.
  group: ${{ github.workflow }}-${{ inputs.thread_key || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # The GitHub maximum for a hosted job. A campaign that cannot finish inside
    # it is not followed from a browser at all — see docs/workflow-tests.md.
    timeout-minutes: 360
    outputs:
      # `publish` needs it, and job env does not cross jobs.
      thread_key: ${{ steps.identity.outputs.key }}
    env:
      CI: 'true'
      E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      E2E_ENVIRONMENT: ${{ inputs.environment }}
      # The deployment behind the target: the preview is the staging backend.
      E2E_ENV: ${{ inputs.environment == 'production' && 'production' || 'staging' }}
      E2E_BASE_URL: >-
        ${{ inputs.environment == 'production' && vars.PRODUCTION_APP_URI
            || inputs.environment == 'preview' && vars.PREVIEW_APP_URI
            || vars.STAGING_APP_URI }}
      E2E_TEST_USERNAME: >-
        ${{ inputs.environment == 'production' && secrets.OBI_USERNAME_PRODUCTION
            || secrets.OBI_USERNAME_STAGING }}
      E2E_TEST_PASSWORD: >-
        ${{ inputs.environment == 'production' && secrets.OBI_PASSWORD_PRODUCTION
            || secrets.OBI_PASSWORD_STAGING }}
      LAB_ID: >-
        ${{ inputs.environment == 'production' && secrets.LAB_ID_PRODUCTION
            || secrets.LAB_ID_STAGING }}
      E2E_SLOW_PROJECT_CREDITS: ${{ vars.E2E_SLOW_PROJECT_CREDITS }}
      PLAYWRIGHT_BROWSER: chromium
      # Reported as what started the run, not as the dispatch that relayed it.
      E2E_EVENT: ${{ inputs.event || github.event_name }}
      E2E_RELEASE: ${{ inputs.release }}
      E2E_RELEASE_URL: ${{ inputs.release_url }}
      E2E_RELEASE_COMMIT: ${{ inputs.release_commit }}
    steps:
      # The key `e2e.yml` handed over, or, for a run started here by hand, one of
      # its own in the same shape.
      - name: Run identity
        id: identity
        env:
          KEY: ${{ inputs.thread_key }}
          STARTED: ${{ inputs.started }}
          RUN: ${{ github.run_id }}
        run: |
          if [[ -z "$KEY" ]]; then
            STARTED="$(date -u +'%F %H:%M')"
            KEY="${STARTED%% *}-workflow_dispatch-$RUN-$E2E_ENVIRONMENT"
          fi
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          {
            echo "TEAMS_THREAD_KEY=$KEY"
            echo "E2E_STARTED=$STARTED UTC"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install browsers
        run: bun run browsers

      - name: Check configuration
        run: |
          : "${E2E_BASE_URL:?No URL for ${E2E_ENVIRONMENT}: set the repository variable}"
          bun run preflight

      - name: Run the slow campaigns
        run: bun run test --project=slow

      - name: Give the project back
        if: always()
        run: bun scripts/ci/teardown.ts

      - name: Summarize results
        if: always()
        run: bun scripts/ci/summarize-results.ts test-results/results.json test-results

      - name: Job summary
        if: always()
        run: cat test-results/summary.md >> "$GITHUB_STEP_SUMMARY"

      # Same as the regular suite: without this the dashboard has no scenario to
      # open beside a slow failure, which is the half of a run it explains least.
      - name: Collect the scenarios that failed
        if: always()
        run: bun scripts/ci/collect-scenarios.ts test-results/results.json playwright-report

      - id: report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-slow
          path: |
            playwright-report/
            test-results/
          retention-days: 5

      - name: Post Teams card
        if: always()
        env:
          MS_TEAMS_WEBHOOK_URI: ${{ secrets.MS_TEAMS_WEBHOOK_URI }}
          TEAMS_LAYOUT: thread
          E2E_REPORT_URL: ${{ steps.report.outputs.artifact-url }}
          # TEAMS_THREAD_KEY and E2E_STARTED were written by the first step,
          # E2E_RELEASE is in the job's environment. E2E_SUITE names the badge
          # this call adds. No announce here, so started on its own this call
          # opens the thread — hence the suite list, used only in that case.
          E2E_SUITE: Slow
          E2E_SUITES: slow
          TEAMS_ALERT_MENTIONS: ${{ vars.TEAMS_ALERT_MENTIONS }}
        run: bun scripts/ci/teams-card.ts test-results/summary.json

  publish:
    needs: run
    # `always()` has to be in here. An `if:` with no status function is silently
    # ANDed with `success()`, so this job skipped itself on the first failing run
    # it saw — exactly the run whose report people wanted. The rest filters out a
    # cancellation: a cancelled run uploads no artifact for the download step to
    # find. A run that finished, pass or fail, has one.
    if: always() && (needs.run.result == 'success' || needs.run.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # No checkout and no bun: this job clones the published branch itself and
    # runs nothing from the repository.
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: playwright-report-slow
          path: artifact

      - name: Fold this run in beside the regular report
        env:
          GH_TOKEN: ${{ github.token }}
          THREAD_KEY: ${{ needs.run.outputs.thread_key }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}"
          root=$PWD

          fold() {
            cd "$root"
            rm -rf _site
            if git clone -q --depth 1 --branch gh-pages "$remote" _site; then
              base=$(git -C _site rev-parse HEAD)
            else
              mkdir -p _site && git -C _site init -q && base=''
            fi
            mkdir -p _site/runs

            # The folder this run's key names. Whichever suite publishes first
            # opens it; newest first, for a key a re-run left on two folders.
            folder=$(grep -lx "$THREAD_KEY" _site/runs/*/thread-key 2>/dev/null |
              sort -r | head -1 | cut -d/ -f3 || true)

            # Started on its own, or the regular suite has not published yet: open
            # the folder here, named the way it would have been.
            if [ -z "$folder" ]; then
              stamp="$(date -u +%F-%Hh%M)-$ENVIRONMENT"
              folder=$stamp
              n=0
              while [ -d "_site/runs/$folder" ]; do n=$((n + 1)); folder=$stamp-$n; done
              mkdir -p "_site/runs/$folder"
              echo "$THREAD_KEY" > "_site/runs/$folder/thread-key"
            fi

            rm -rf "_site/runs/$folder/slow"
            mkdir -p "_site/runs/$folder/slow"
            cp -r artifact/playwright-report "_site/runs/$folder/slow/report"
            cp artifact/test-results/summary.json "_site/runs/$folder/slow/summary.json"
            touch _site/.nojekyll

            # No sweep and no history here: this job only adds to a folder, and the
            # regular suite's publish owns both. runs.json is rewritten because the
            # fallback above can have created a folder nothing else knows about.
            ls -1 _site/runs | sort -r | jq -Rn '[inputs]' > _site/runs.json

            cd _site
            git checkout -q --orphan publish
            git add -A
            git -c user.name=github-actions -c user.email=github-actions@github.com \
              commit -qm "E2E slow results — $folder"
          }

          # No lock, the same as the regular suite's publish: the lease refuses a
          # push onto a branch that moved since the clone, and the fold starts
          # again from a fresh one.
          for attempt in 1 2 3 4 5 6 7 8; do
            fold
            if git push -q --force-with-lease="gh-pages:$base" "$remote" HEAD:refs/heads/gh-pages; then
              echo "Published into runs/$folder/slow."
              exit 0
            fi
            echo "::notice::gh-pages moved while publishing (attempt $attempt); folding again."
            sleep $((attempt * 5))
          done
          echo "::error::Could not publish runs/$folder/slow after 8 attempts."
          exit 1
