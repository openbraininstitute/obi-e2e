name: E2E

# A run that restarts on a new build is named for it, so a second suite that
# saw the same move finds it rather than starting another (see
# scripts/ci/app-version.ts). Empty for every other run, which GitHub then names
# as usual.
run-name: >-
  ${{ inputs.release && format('E2E · {0} · {1}', inputs.environment, inputs.release) || '' }}

on:
  schedule:
    # 08:00 in Zurich. GitHub reads cron in UTC and knows no time zones, so both
    # offsets are listed and `matrix` keeps the one that is 08:00 there today:
    # 06:00 UTC in summer (CEST), 07:00 UTC in winter (CET). The other plans
    # nothing. The string must match `github.event.schedule` exactly.
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
  push:
    # `main` is tested on the preview, `release` on staging: see "Two branches"
    # in README.md.
    branches: [main, release]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [preview, staging, production]
        default: staging
      grep:
        description: Only run tests matching this tag or title (e.g. @credits)
        type: string
        default: ''
      slow:
        description: Also run the slow suite, in the same Teams thread and report folder
        type: boolean
        default: false
      release:
        description: Set when a run restarts on a new build. Leave empty.
        type: string
        default: ''
  repository_dispatch:
    # `core-web-app` fires this when it releases, with the tag in
    # `client_payload.release`. The release goes to staging, like every other
    # unattended run.
    #
    # `core-web-app-main` is fired on every merge to `core-web-app`'s main, with
    # the merge commit in `client_payload.commit`, once the main preview serves
    # that commit — the waiting happens there. It tests the main preview.
    types: [core-web-app-release, core-web-app-main]

# Pull requests are not tested here for the time being: the suite runs against
# staging and production only. Putting per-PR runs back means restoring the
# `pull_request` trigger, or adding the `e2e-preview` type that
# `.github/examples/pr-label-bridge.example.yml` fires to the dispatch above — see git history
# for both.
#
# Three targets, each with its URL in a repository variable: `preview`
# (PREVIEW_APP_URI, the main branch's Amplify preview), `staging`
# (STAGING_APP_URI) and `production` (PRODUCTION_APP_URI). The preview runs on
# the staging backend, so it signs in with the staging secrets and skips what
# `@production` marks.

concurrency:
  # One group per run, so no run waits on or cancels another: each creates its
  # own project, posts its own Teams thread and publishes its own folder. A
  # shared group did both — GitHub keeps one waiting run per group and cancels it
  # when a third arrives, and a manual dispatch cancelled the nightly run in
  # flight. Only a manual re-dispatch at the same target supersedes the manual
  # run before it, a core-web-app merge the run for the merge before it, and a
  # push to this repository's main the push run before it: one run of main at
  # a time, testing the newest tests. Its slow suite goes with it (see
  # e2e-slow.yml).
  #
  # core-web-app dispatches a merge only once the preview serves it, so by then
  # the older run is testing a build the preview no longer has: its pages fail
  # on chunks that 404. Schedules, releases and pushes stay in groups of their
  # own and are never cancelled by a merge. A build that changes under any run
  # is caught by the run itself ("Watch the build under test"), which says so
  # in its thread and publishes nothing.
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch'
        && format('manual-{0}', inputs.environment)
        || github.event.action == 'core-web-app-main' && 'core-web-app-main'
        || github.event_name == 'push' && format('push-{0}', github.ref_name)
        || github.run_id }}
  cancel-in-progress: >-
    ${{ github.event_name == 'workflow_dispatch' || github.event.action == 'core-web-app-main'
        || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  # Decides what this run is, once, for every job and for the slow suite: its
  # targets, whether the slow suite runs, and the key that names its Teams thread
  # and its report folder. Computed in one place, the two suites cannot disagree
  # about it — when each workflow worked it out for itself, a merge landing
  # between two delayed schedules, or a run starting at midnight, gave the two
  # halves of one run two threads and two folders.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      runs: ${{ steps.plan.outputs.runs }}
      slow: ${{ steps.plan.outputs.slow }}
      started: ${{ steps.plan.outputs.started }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_ENV: ${{ inputs.environment }}
          INPUT_GREP: ${{ inputs.grep }}
          INPUT_SLOW: ${{ inputs.slow }}
          ACTION: ${{ github.event.action }}
          RELEASE: ${{ github.event.client_payload.release }}
          RELEASE_COMMIT: ${{ github.event.client_payload.commit }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          RUN: ${{ github.run_id }}
          PREVIEW_APP_URI: ${{ vars.PREVIEW_APP_URI }}
          STAGING_APP_URI: ${{ vars.STAGING_APP_URI }}
          PRODUCTION_APP_URI: ${{ vars.PRODUCTION_APP_URI }}
        run: |
          if [[ "$EVENT" == schedule ]]; then
            # Zurich's offset now is its offset at 08:00 today: clocks change at
            # 01:00 UTC, before either cron fires.
            offset=$(TZ=Europe/Zurich date +%z)
            want="0 $((8 - 10#${offset:1:2})) * * *"
            if [[ "$SCHEDULE" != "$want" ]]; then
              echo "::notice::'$SCHEDULE' is not 08:00 in Zurich today ('$want' is); nothing to run."
              echo "runs=[]" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          case "$EVENT" in
            schedule)
              # Production is off until its credentials exist. To bring it back, add
              # {name:"production",environment:"production",grep:""} to this list.
              runs=$(jq -cn '[{name:"staging",environment:"staging",grep:""}]')
              slow=true ;;
            repository_dispatch)
              env=$([[ "$ACTION" == core-web-app-main ]] && echo preview || echo staging)
              runs=$(jq -cn --arg env "$env" '[{name:$env,environment:$env,grep:""}]')
              # A core-web-app merge runs the regular suite only: hours of campaigns
              # on every merge.
              slow=$([[ "$ACTION" == core-web-app-main ]] && echo false || echo true) ;;
            workflow_dispatch)
              runs=$(jq -cn --arg env "$INPUT_ENV" --arg grep "$INPUT_GREP" \
                '[{name:$env,environment:$env,grep:$grep}]')
              slow=$([[ "$INPUT_SLOW" == true ]] && echo true || echo false) ;;
            *)
              # A push to this repository: a PR merged to `main` is tested against
              # the main preview, one merged to `release` against staging, the
              # deployment that branch is for. Only the manual arm reads an input,
              # and only a manual dispatch can set one, so production stays
              # unreachable from anything automatic.
              env=$([[ "$REF" == release ]] && echo staging || echo preview)
              runs=$(jq -cn --arg env "$env" '[{name:$env,environment:$env,grep:""}]')
              slow=true ;;
          esac

          # The key names the Teams thread and the report folder. A release seeds
          # it with its tag, a core-web-app merge with that repository's commit, a
          # manual run with its own run id, everything else with this sha. The
          # environment is in it, so two targets of one run never share either.
          now="$(date -u +'%F %H:%M')"
          seed="${RELEASE:-${RELEASE_COMMIT:-$SHA}}"
          [[ -n "$RELEASE" ]] || seed="${seed:0:7}"
          [[ "$EVENT" != workflow_dispatch ]] || seed="$RUN"
          prefix="${now%% *}-$EVENT-$seed"

          # The host each target serves, for the job title: "staging" alone does
          # not say which URL the run hit.
          runs=$(jq -c --arg preview "$PREVIEW_APP_URI" --arg staging "$STAGING_APP_URI" \
            --arg production "$PRODUCTION_APP_URI" --arg prefix "$prefix" \
            'map(.host = ({$preview, $staging, $production}[.environment] // "" | sub("^https?://"; ""))
                 | .key = "\($prefix)-\(.environment)")' \
            <<< "$runs")
          {
            echo "runs=$runs"
            echo "slow=$slow"
            echo "started=$now"
          } >> "$GITHUB_OUTPUT"

  # The `release` branch is what staging and production run (README.md, "Two
  # branches"). Nothing here merges: people merge. This job only makes sure the
  # branch exists, and on a web-app release opens the pull request `main` →
  # `release` so that the update cannot be forgotten. Always runs, and does
  # nothing on most events, so `run` can wait on it without an `always()`.
  release-branch:
    needs: matrix
    if: needs.matrix.outputs.runs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The first run after this job lands finds no `release` branch: it starts
      # as a copy of `main`, so that day's staging run is what it was yesterday.
      - name: Create release from main the first time
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release" > /dev/null 2>&1 && exit 0
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/release -f sha="$main" > /dev/null
          echo "Created release from main ($main)." >> "$GITHUB_STEP_SUMMARY"

      # One open PR at a time: a second release while it waits only reports.
      # Nothing to open when `release` already has everything `main` has.
      #
      # The pull request is a reminder, not the run: `run` waits on this job, so
      # a refused PR would leave staging untested. GitHub refuses it while the
      # repository setting "Allow GitHub Actions to create and approve pull
      # requests" is off; the step then warns and links the page to open it by
      # hand, and the run goes on.
      - name: Open the release pull request
        if: github.event.action == 'core-web-app-release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ github.event.client_payload.release }}
          RELEASE_URL: ${{ github.event.client_payload.release_url }}
        run: |
          set -euo pipefail
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --base release --head main --json url --jq '.[0].url')
          if [[ -n "$open" ]]; then
            echo "::notice::The release pull request is already open: $open"
            exit 0
          fi
          ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/release...main" --jq .ahead_by)
          if [[ "$ahead" == 0 ]]; then
            echo "release already has everything main has; no pull request to open." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base release --head main \
            --title "Release $RELEASE: update the staging tests" \
            --body "The web app released [$RELEASE]($RELEASE_URL) to staging. Merge this so staging and production run the tests written for it. Resolve any conflict here." 2>&1); then
            echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"
          else
            compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/release...main?expand=1"
            echo "::warning::Could not open the release pull request ($url). Open it by hand: $compare"
            echo "Could not open the release pull request for $RELEASE: $url. [Open it by hand]($compare)." >> "$GITHUB_STEP_SUMMARY"
          fi

  run:
    needs: [matrix, release-branch]
    if: needs.matrix.outputs.runs != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To cancel this run when the build under it changes, to start the run
      # for the new build, and to find the run that tests it.
      actions: write
    # A 2-core runner gives workersFor() two workers, so the whole suite walks
    # through 248 tests two at a time. Forty-five minutes cut it off mid-run.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.matrix.outputs.runs) }}
    # `staging · staging.openbraininstitute.org`. The artifact below keeps the bare
    # name: a host there would only lengthen it.
    name: >-
      ${{ matrix.run.host && format('{0} · {1}', matrix.run.name, matrix.run.host)
          || matrix.run.name }}
    env:
      CI: 'true'
      E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      E2E_ENVIRONMENT: ${{ matrix.run.environment }}
      # The deployment behind the target: the preview is the staging backend.
      E2E_ENV: ${{ matrix.run.environment == 'production' && 'production' || 'staging' }}
      E2E_BASE_URL: >-
        ${{ matrix.run.environment == 'production' && vars.PRODUCTION_APP_URI
            || matrix.run.environment == 'preview' && vars.PREVIEW_APP_URI
            || vars.STAGING_APP_URI }}
      E2E_TEST_USERNAME: >-
        ${{ matrix.run.environment == 'production' && secrets.OBI_USERNAME_PRODUCTION
            || secrets.OBI_USERNAME_STAGING }}
      E2E_TEST_PASSWORD: >-
        ${{ matrix.run.environment == 'production' && secrets.OBI_PASSWORD_PRODUCTION
            || secrets.OBI_PASSWORD_STAGING }}
      E2E_ONBOARDING_USERNAME: >-
        ${{ matrix.run.environment == 'production' && secrets.OBI_ONBOARDING_USERNAME_PRODUCTION
            || secrets.OBI_ONBOARDING_USERNAME_STAGING }}
      E2E_ONBOARDING_PASSWORD: >-
        ${{ matrix.run.environment == 'production' && secrets.OBI_ONBOARDING_PASSWORD_PRODUCTION
            || secrets.OBI_ONBOARDING_PASSWORD_STAGING }}
      LAB_ID: >-
        ${{ matrix.run.environment == 'production' && secrets.LAB_ID_PRODUCTION
            || secrets.LAB_ID_STAGING }}
      E2E_PROJECT_CREDITS: ${{ vars.E2E_PROJECT_CREDITS }}
      PLAYWRIGHT_BROWSER: chromium
      # The run's identity, decided by `matrix` and handed to the slow suite as
      # is. The started stamp is frozen there because the parent card is rebuilt
      # at the end of every suite, and reading the clock then would move
      # "Started" to whichever suite finished last.
      TEAMS_THREAD_KEY: ${{ matrix.run.key }}
      E2E_STARTED: ${{ needs.matrix.outputs.started }} UTC
      E2E_EVENT: ${{ github.event_name }}
      E2E_RELEASE: ${{ github.event.client_payload.release || inputs.release }}
      E2E_RELEASE_URL: ${{ github.event.client_payload.release_url }}
      E2E_RELEASE_COMMIT: ${{ github.event.client_payload.commit }}
      # What a restart on a new build runs: the suites this run runs.
      E2E_RESTART_SLOW: ${{ needs.matrix.outputs.slow }}
    steps:
      # The preview runs the tests of `main`; staging and production run the
      # tests of `release`, which `release-branch` above has just brought up to
      # date for a web-app release.
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.run.environment == 'preview' && github.sha || 'release' }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      # Before the announce, so the thread names the build it tests. Empty when
      # the target does not answer, and then nothing is watched.
      - name: Note the build under test
        run: echo "E2E_APP_VERSION=$(bun scripts/ci/app-version.ts note)" >> "$GITHUB_ENV"

      # Only this workflow announces. It opens the thread in the first minute of
      # the job, hours before any result, so the flow always has a parent message
      # to reply to — including for the slow suite, which never announces. A
      # webhook that is down must not cost us the suite.
      - name: Announce the run in Teams
        continue-on-error: true
        env:
          MS_TEAMS_WEBHOOK_URI: ${{ secrets.MS_TEAMS_WEBHOOK_URI }}
          TEAMS_LAYOUT: thread
          E2E_SUITES: ${{ needs.matrix.outputs.slow == 'true' && 'regular, slow' || 'regular' }}
        run: bun scripts/ci/teams-card.ts --start

      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install browsers
        run: bun run browsers

      - name: Check configuration
        env:
          E2E_GREP: ${{ matrix.run.grep }}
        run: |
          : "${E2E_BASE_URL:?No URL for ${E2E_ENVIRONMENT}: set the repository variable}"
          bun run preflight

      # In the background, for as long as the tests run: a new build under them
      # cancels the run, and the steps below say why.
      - name: Watch the build under test
        env:
          GH_TOKEN: ${{ github.token }}
        run: nohup bun scripts/ci/app-version.ts watch > app-version-watch.log 2>&1 &

      # Without `--project=slow` the config defines no slow project, so the slow
      # campaigns stay in their own job.
      - name: Run tests
        id: tests
        env:
          E2E_GREP: ${{ matrix.run.grep }}
        run: |
          if [[ -n "$E2E_GREP" ]]; then
            bun run test --grep "$E2E_GREP"
          else
            bun run test
          fi

      # The results are in. A build that changes from here on changed after them.
      - name: Stop watching
        if: always()
        run: |
          pkill -f 'app-version.ts watch' || true
          cat app-version-watch.log 2>/dev/null || true

      - name: Give the project back
        if: always()
        run: bun scripts/ci/teardown.ts

      - name: Summarize results
        if: always()
        run: bun scripts/ci/summarize-results.ts test-results/results.json test-results

      - name: Job summary
        if: always()
        run: cat test-results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Collect the scenarios that failed
        if: always()
        run: bun scripts/ci/collect-scenarios.ts test-results/results.json playwright-report

      - id: report
        uses: actions/upload-artifact@v4
        if: always()
        # The report holds the stack traces and each failure's error-context;
        # test-results/ holds the videos and traces, and stays behind. The two
        # summaries go with it, because `publish` reads them.
        with:
          name: playwright-report-${{ matrix.run.name }}
          path: |
            playwright-report/
            test-results/summary.md
            test-results/summary.json
          retention-days: 5

      - name: Rebuild the summary with the report link
        if: always()
        env:
          E2E_REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: bun scripts/ci/summarize-results.ts test-results/results.json test-results

      # Cancelled on purpose: the build under test changed (the watcher above, or
      # a newer merge), or a newer push to main replaced the run (see
      # `concurrency`). Its results would mislead, so the thread gets why
      # instead, with the run that replaced it. A run cancelled for any other
      # reason writes nothing here and posts its card as before.
      # `continue-on-error`, because a lookup that fails must not cost the thread
      # its card.
      - name: Check why the run stopped
        id: stopped
        if: cancelled()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci/app-version.ts stopped

      - name: Say the run was stopped
        if: cancelled() && steps.stopped.outputs.why != ''
        env:
          MS_TEAMS_WEBHOOK_URI: ${{ secrets.MS_TEAMS_WEBHOOK_URI }}
          TEAMS_LAYOUT: thread
          E2E_SUITE: Regular
          E2E_STOPPED_WHY: ${{ steps.stopped.outputs.why }}
          E2E_STOPPED_TO: ${{ steps.stopped.outputs.to }}
          E2E_REPLACED_BY: ${{ steps.stopped.outputs.by }}
        run: bun scripts/ci/teams-card.ts --stopped

      - name: Post Teams card
        if: ${{ !cancelled() || steps.stopped.outputs.why == '' }}
        env:
          MS_TEAMS_WEBHOOK_URI: ${{ secrets.MS_TEAMS_WEBHOOK_URI }}
          TEAMS_LAYOUT: thread
          E2E_REPORT_URL: ${{ steps.report.outputs.artifact-url }}
          # TEAMS_THREAD_KEY, E2E_RELEASE and E2E_STARTED are in the job's
          # environment. E2E_SUITE names the badge this call adds to the parent;
          # the rest of that card was stored when the announce opened the thread
          # and is not rebuilt from here.
          E2E_SUITE: Regular
          # Names to tag when the lab itself cannot pay for the run. A repository
          # variable, not a secret: it is work addresses, and being able to read
          # it back is the point.
          TEAMS_ALERT_MENTIONS: ${{ vars.TEAMS_ALERT_MENTIONS }}
        run: bun scripts/ci/teams-card.ts test-results/summary.json

  # The slow suite is its own workflow, for its six-hour clock, but never its own
  # run: this job starts it with this run's key, so the two suites post into one
  # Teams thread and publish into one report folder whatever started them. It
  # starts with the regular suite and runs beside it, so neither waits.
  slow:
    needs: matrix
    if: needs.matrix.outputs.runs != '[]' && needs.matrix.outputs.slow == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.matrix.outputs.runs) }}
    name: slow · ${{ matrix.run.name }}
    steps:
      - name: Start the slow suite
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ matrix.run.environment }}
          KEY: ${{ matrix.run.key }}
          STARTED: ${{ needs.matrix.outputs.started }}
          RELEASE: ${{ github.event.client_payload.release || inputs.release }}
          RELEASE_URL: ${{ github.event.client_payload.release_url }}
          RELEASE_COMMIT: ${{ github.event.client_payload.commit }}
        run: |
          gh workflow run e2e-slow.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f environment="$ENVIRONMENT" -f thread_key="$KEY" -f started="$STARTED" \
            -f event="$GITHUB_EVENT_NAME" -f release="$RELEASE" \
            -f release_url="$RELEASE_URL" -f release_commit="$RELEASE_COMMIT"
          echo "Started the slow suite for $KEY." >> "$GITHUB_STEP_SUMMARY"

  # The dashboard is built here rather than in `publish`, and on purpose. `publish`
  # runs `if: always()`, so it is the job that still reports a night the suite
  # failed — which is the night people open the page. A bundler error in this job
  # costs the new dashboard and nothing else: `publish` keeps serving the one
  # already on the branch.
  site:
    needs: matrix
    if: needs.matrix.outputs.runs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - run: bun run site:build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: gh-web/dist/
          retention-days: 5

  # One publish per target, each into the folder its own key names, so a run
  # that tests two deployments never folds one into the other.
  publish:
    needs: [matrix, run, site]
    # Not for a cancelled run: its build changed under it, or someone stopped
    # it, and a half-run report would sit on the dashboard as if it were a result.
    if: ${{ !cancelled() && needs.matrix.outputs.runs != '[]' && needs.run.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.matrix.outputs.runs) }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/download-artifact@v5
        with:
          name: playwright-report-${{ matrix.run.name }}
          path: artifact

      - uses: actions/download-artifact@v5
        # Absent when the site job failed. The step below keeps whatever the
        # branch already serves rather than publishing an empty page.
        continue-on-error: true
        with:
          name: site
          path: site-dist

      - name: Fold this run into the last five days
        env:
          GH_TOKEN: ${{ github.token }}
          THREAD_KEY: ${{ matrix.run.key }}
          ENVIRONMENT: ${{ matrix.run.environment }}
        run: |
          set -euo pipefail
          day=$(date -u +%F)
          remote="https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}"
          root=$PWD

          # Builds the branch from a fresh clone: this run's folder, the history,
          # the bundle and the five-day sweep. Run again from scratch on a retry.
          fold() {
            cd "$root"
            rm -rf _site
            if git clone -q --depth 1 --branch gh-pages "$remote" _site; then
              base=$(git -C _site rev-parse HEAD)
            else
              mkdir -p _site && git -C _site init -q && base=''
            fi
            mkdir -p _site/runs

            # Whichever suite publishes first opens the folder; the other one folds
            # into it, found by the key both were handed.
            folder=$(grep -lx "$THREAD_KEY" _site/runs/*/thread-key 2>/dev/null |
              sort -r | head -1 | cut -d/ -f3 || true)

            # A folder per run, not per day: a push at 10:00 used to overwrite the
            # night's report. The name reads `<date>-<HHhMM>-<environment>`, so the
            # page can offer one deployment at a time without opening every summary
            # to find out which is which. The counter is only for a second run
            # inside the same minute, and every form still sorts into time order.
            if [ -z "$folder" ]; then
              stamp="$(date -u +%F-%Hh%M)-$ENVIRONMENT"
              folder=$stamp
              n=0
              while [ -d "_site/runs/$folder" ]; do n=$((n + 1)); folder=$stamp-$n; done
            fi

            mkdir -p "_site/runs/$folder"
            # `cp -r` into an existing directory nests rather than replaces, which a
            # re-run under the same key would otherwise do.
            rm -rf "_site/runs/$folder/report"
            cp -r artifact/playwright-report "_site/runs/$folder/report"
            cp artifact/test-results/summary.json "_site/runs/$folder/summary.json"
            echo "$THREAD_KEY" > "_site/runs/$folder/thread-key"
            touch _site/.nojekyll

            # The day sweep below takes the reports with it, so the numbers the trend
            # charts read are kept separately. This is the only file on the branch
            # that outlives five days.
            bun scripts/ci/history.ts \
              artifact/test-results/summary.json _site/history.json "$day"

            if [ -d site-dist ]; then
              # Clear the paths the bundle owns before copying, or last week's hashed
              # assets stay on the branch forever. Only those: `runs/`, `runs.json`
              # and `history.json` sit beside the bundle and are not its to delete.
              find site-dist -mindepth 1 -maxdepth 1 -printf '%P\n' |
                while read -r owned; do rm -rf "_site/$owned"; done
              cp -r site-dist/. _site/
            else
              echo "::warning::The site job produced no bundle; keeping the published one."
            fi

            # Every run of the five newest days stays; older days go, runs and all.
            # A folder's day is its first ten characters.
            ls -1 _site/runs | cut -c1-10 | sort -ru | tail -n +6 |
              while read -r old; do rm -rf "_site/runs/$old"*; done
            ls -1 _site/runs | sort -r | jq -Rn '[inputs]' > _site/runs.json

            # One commit with no history, so five days of reports never grow the
            # repository.
            cd _site
            git checkout -q --orphan publish
            git add -A
            git -c user.name=github-actions -c user.email=github-actions@github.com \
              commit -qm "E2E results — $folder"
          }

          # No lock: every run publishes as soon as it finishes, and the push only
          # lands on the branch it was built from. When another run pushed in
          # between, the lease refuses it and the fold starts again from a fresh
          # clone, so a conflict costs a retry rather than a report. A concurrency
          # group cannot promise that: GitHub keeps one waiting job per group and
          # cancels it when a third arrives.
          for attempt in 1 2 3 4 5 6 7 8; do
            fold
            if git push -q --force-with-lease="gh-pages:$base" "$remote" HEAD:refs/heads/gh-pages; then
              echo "Published into runs/$folder."
              exit 0
            fi
            echo "::notice::gh-pages moved while publishing (attempt $attempt); folding again."
            sleep $((attempt * 5))
          done
          echo "::error::Could not publish runs/$folder after 8 attempts."
          exit 1
