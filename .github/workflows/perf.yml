name: Perf

on:
  schedule:
    # 08:00 in Zurich, the same time as the test run. GitHub reads cron in UTC only,
    # so both offsets are listed and `when` keeps the one that is 08:00 there
    # today: 06:00 UTC in summer (CEST), 07:00 UTC in winter (CET). The string
    # must match `github.event.schedule` exactly.
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  # One group per run, as in e2e.yml: the schedule's second cron must not cancel
  # the audit the first one started. A manual re-dispatch at the same target
  # still supersedes the one before it.
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch'
        && format('manual-{0}', inputs.environment) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  when:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.zurich.outputs.go }}
    steps:
      - id: zurich
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          go=true
          if [[ "$EVENT" == schedule ]]; then
            # Zurich's offset now is its offset at 08:00 today: clocks change at
            # 01:00 UTC, before either cron fires.
            offset=$(TZ=Europe/Zurich date +%z)
            [[ "$SCHEDULE" == "0 $((8 - 10#${offset:1:2})) * * *" ]] || go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  audit:
    needs: when
    if: needs.when.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Publishes the reports to the gh-pages branch, like e2e.yml's publish job.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # The schedule audits both deployments. A manual run audits the one chosen.
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.environment)) || fromJSON('["staging", "production"]') }}
    name: ${{ matrix.environment }}
    env:
      CI: 'true'
      E2E_ENV: ${{ matrix.environment }}
      # The key the Teams flow threads by: the announce and the result share it, and
      # the run id keeps a second run the same day in a thread of its own.
      TEAMS_THREAD_KEY: perf-${{ github.run_id }}-${{ matrix.environment }}
      E2E_BASE_URL: >-
        ${{ matrix.environment == 'production' && vars.PRODUCTION_APP_URI
            || vars.STAGING_APP_URI }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - name: Announce the run in Teams
        env:
          MS_TEAMS_WEBHOOK_URI: ${{ secrets.MS_TEAMS_WEBHOOK_URI }}
          TEAMS_LAYOUT: thread
        run: bun run notify --perf --start

      - name: Audit the marketing pages
        run: bun run perf

      - id: report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report-${{ matrix.environment }}
          path: |
            perf/report/
            .lighthouseci/assertion-results.json
          retention-days: 5

      - name: Publish the reports to GitHub Pages
        id: pages
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/publish-perf.sh "${{ matrix.environment }}" "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: Post Teams card
        if: always()
        env:
          MS_TEAMS_WEBHOOK_URI: ${{ secrets.MS_TEAMS_WEBHOOK_URI }}
          TEAMS_LAYOUT: thread
          E2E_REPORT_URL: ${{ steps.report.outputs.artifact-url }}
          PERF_REPORT_PAGE: ${{ steps.pages.outputs.url }}
        run: bun run notify --perf
