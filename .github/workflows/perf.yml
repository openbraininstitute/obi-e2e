name: Perf

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The schedule audits both deployments. A manual run audits the one chosen.
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.environment)) || fromJSON('["staging", "production"]') }}
    name: ${{ matrix.environment }}
    env:
      CI: 'true'
      E2E_ENV: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - name: Audit the marketing pages
        run: bun run perf

      - id: report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report-${{ matrix.environment }}
          path: |
            perf/report/
            .lighthouseci/assertion-results.json
          retention-days: 5

      - name: Post Teams card
        if: always()
        env:
          MS_TEAMS_WEBHOOK_URI: ${{ secrets.MS_TEAMS_WEBHOOK_URI }}
          TEAMS_LAYOUT: thread
          E2E_REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: bun run notify --perf
